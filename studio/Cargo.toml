[package]
name = "studio"
version = "0.1.0"
edition = "2021"
description = "Photonic design studio: microring physics fitted to measured silicon, and a live simulator of a ring weight-bank core."

# Standalone workspace: independent of the QuPU crate at the repo root.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
miniz_oxide = "0.8"
wgpu = "30.0.1"
bytemuck = { version = "1.25", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Node", "Element", "HtmlElement", "HtmlCanvasElement",
  "HtmlInputElement", "HtmlSelectElement", "CssStyleDeclaration", "DomRect",
  "Event", "EventTarget", "MouseEvent", "Performance",
  "CanvasRenderingContext2d",
  "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer",
  "WebGlVertexArrayObject", "WebGlUniformLocation",
] }

[[bin]]
name = "studio-cli"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
