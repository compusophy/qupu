<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuPU // virtual quantum processing unit</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #060810; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #00ffd1; font: 13px ui-monospace, monospace; letter-spacing: 0.1em; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="qupu_canvas"></canvas>
  <div id="loading">// booting qupu kernel</div>
  <script type="module">
    import init, { start } from './pkg/qupu.js';
    await init();
    document.getElementById('loading').remove();
    start('qupu_canvas');
  </script>
</body>
</html>
