[package]
name = "qupu_core"
version = "0.1.0"
edition = "2021"
description = "Quantum Processing Unit kernel: state-vector simulator compiled to WebAssembly."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
