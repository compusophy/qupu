[package]
name = "qupu"
version = "0.2.0"
edition = "2021"
description = "QuPU — virtual quantum processing unit. Pure-Rust state-vector simulator with an egui frontend; the visualization is the simulation."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
egui = "0.34"
eframe = { version = "0.34", default-features = false, features = ["glow", "default_fonts"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[[bin]]
name = "qupu-native"
path = "src/native.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
